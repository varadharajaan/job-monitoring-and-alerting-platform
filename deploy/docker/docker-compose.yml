version: '3.9'

# ═══════════════════════════════════════════════════════════════════
#  Reads secrets from .env file in project root.
#  Copy .env.example → .env and fill in values before starting.
#  NEVER hardcode passwords in this file.
# ═══════════════════════════════════════════════════════════════════

services:
  # ═══════════════ Eureka Discovery Server ═══════════════
  eureka-server:
    image: jobmonitor/eureka-server:latest
    container_name: jobmonitor-eureka
    environment:
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-eureka}
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════ PostgreSQL + TimescaleDB ═══════════════
  postgres:
    env_file:
      - ../../.env
    image: timescale/timescaledb:latest-pg16
    container_name: jobmonitor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════ Apache Kafka (KRaft mode) ═══════════════
  kafka:
    image: apache/kafka:3.7.0
    container_name: jobmonitor-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ═══════════════ Redis ═══════════════
  redis:
    image: redis:7-alpine
    container_name: jobmonitor-redis
    env_file:
      - ../../.env
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════ LocalStack (S3 Emulation) ═══════════════
  localstack:
    image: localstack/localstack:3
    container_name: jobmonitor-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  # ═══════════════ Elasticsearch ═══════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: jobmonitor-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ═══════════════ Prometheus ═══════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: jobmonitor-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alertmanager-rules.yml:/etc/prometheus/alertmanager-rules.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'

  # ═══════════════ Alertmanager ═══════════════
  alertmanager:
    image: prom/alertmanager:latest
    container_name: jobmonitor-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  # ═══════════════ Zipkin (Distributed Tracing) ═══════════════
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jobmonitor-zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem

  # ═══════════════ Grafana ═══════════════
  grafana:
    image: grafana/grafana:latest
    container_name: jobmonitor-grafana
    env_file:
      - ../../.env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  elasticsearch_data:
  grafana_data:

  # ═══════════════ MailHog (Local SMTP testing) ═══════════════
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobmonitor-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - local
