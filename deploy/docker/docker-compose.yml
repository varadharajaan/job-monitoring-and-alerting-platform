version: '3.9'

services:
  # ═══════════════ PostgreSQL + TimescaleDB ═══════════════
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: jobmonitor-postgres
    environment:
      POSTGRES_DB: jobmonitor
      POSTGRES_USER: jobmonitor
      POSTGRES_PASSWORD: jobmonitor_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════ Apache Kafka (KRaft mode) ═══════════════
  kafka:
    image: apache/kafka:3.7.0
    container_name: jobmonitor-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ═══════════════ Redis ═══════════════
  redis:
    image: redis:7-alpine
    container_name: jobmonitor-redis
    command: redis-server --requirepass redis_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════ LocalStack (S3 Emulation) ═══════════════
  localstack:
    image: localstack/localstack:3
    container_name: jobmonitor-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  # ═══════════════ Prometheus ═══════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: jobmonitor-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # ═══════════════ Grafana ═══════════════
  grafana:
    image: grafana/grafana:latest
    container_name: jobmonitor-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  grafana_data:
