# ═══════════════════════════════════════════════════════════════════
#  DB Performance Service — Deployment + Service
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-performance-service
  namespace: jobmonitor
  labels:
    app: db-performance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db-performance-service
  template:
    metadata:
      labels:
        app: db-performance-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8087"
    spec:
      containers:
        - name: db-performance-service
          image: jobmonitor/db-performance-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: jobmonitor-config
            - secretRef:
                name: jobmonitor-secrets
          env:
            - name: DB_PERF_PORT
              value: "8087"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: db-performance-service
  namespace: jobmonitor
spec:
  selector:
    app: db-performance-service
  ports:
    - port: 8087
      targetPort: 8087
  type: ClusterIP
