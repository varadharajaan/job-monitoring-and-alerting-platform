# ═══════════════════════════════════════════════════════════════════
#  Job Monitoring Service — Deployment + Service
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-monitoring-service
  namespace: jobmonitor
  labels:
    app: job-monitoring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-monitoring-service
  template:
    metadata:
      labels:
        app: job-monitoring-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: job-monitoring-service
          image: jobmonitor/job-monitoring-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: jobmonitor-config
            - secretRef:
                name: jobmonitor-secrets
          env:
            - name: JOB_MONITOR_PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: job-monitoring-service
  namespace: jobmonitor
spec:
  selector:
    app: job-monitoring-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
