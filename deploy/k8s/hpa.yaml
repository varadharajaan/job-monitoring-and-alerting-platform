# ═══════════════════════════════════════════════════════════════════
#  Horizontal Pod Autoscalers for all services
#  Requires metrics-server installed in the cluster
# ═══════════════════════════════════════════════════════════════════

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-gateway-hpa
  namespace: jobmonitor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

