# ═══════════════════════════════════════════════════════════════════
#  Ingress — Route external traffic to services
# ═══════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobmonitor-ingress
  namespace: jobmonitor
  labels:
    app.kubernetes.io/part-of: job-monitoring-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit-connections: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: api.jobmonitor.example.com
      http:
        paths:
          # ── Ingestion Gateway (primary API entry) ──
          - path: /api/v1/ingest
            pathType: Prefix
            backend:
              service:
                name: ingestion-gateway-service
                port:
                  number: 8080

          # ── Auth Service ──
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081

          # ── Job Monitoring ──
          - path: /api/v1/jobs
            pathType: Prefix
            backend:
              service:
                name: job-monitoring-service
                port:
                  number: 8082

          # ── Alerting ──
          - path: /api/v1/alerts
            pathType: Prefix
            backend:
              service:
                name: alerting-service
                port:
                  number: 8083

          # ── Notifications ──
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8084

          # ── Job Queue ──
          - path: /api/v1/queue
            pathType: Prefix
            backend:
              service:
                name: job-queue-service
                port:
                  number: 8085

    # ── Eureka Dashboard (internal use) ──
    - host: eureka.jobmonitor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eureka-service
                port:
                  number: 8761
