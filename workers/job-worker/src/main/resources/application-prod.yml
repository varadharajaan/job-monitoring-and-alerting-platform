# ═══════════════════════════════════════════════════════════════
# AWS Production profile — job-worker
# ═══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://prod-rds-cluster.cluster-xxxxx.us-east-1.rds.amazonaws.com:5432/jobmonitor}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:b-1.msk-cluster.xxxxx.kafka.us-east-1.amazonaws.com:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:AWS_MSK_IAM}
      sasl.jaas.config: >
        software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:prod-elasticache.xxxxx.use1.cache.amazonaws.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

platform:
  kafka:
    topics:
      default-replicas: ${KAFKA_DEFAULT_REPLICAS:3}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:4}
  s3:
    enabled: true
    bucket: ${S3_LOG_BUCKET:job-monitor-logs-prod}
    region: ${AWS_REGION:us-east-1}
  logging:
    dir: /var/log/jobmonitor
    max-file-size: 100MB
    max-history: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.jobmonitor: INFO
