// ═══════════════════════════════════════════════════════════════════
//  Root Build — Job Monitoring & Alerting Platform
//  Shared configuration for all subprojects
// ═══════════════════════════════════════════════════════════════════

plugins {
    id 'java'
    id 'idea'
    id 'jacoco'
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

ext {
    // ── Version Catalog ──
    set('springCloudVersion',       '2023.0.1')
    set('awsSdkVersion',            '2.25.16')
    set('resilience4jVersion',      '2.2.0')
    set('mapstructVersion',         '1.5.5.Final')
    set('logstashEncoderVersion',   '7.4')
    set('springDocVersion',         '2.5.0')
    set('testcontainersVersion',    '1.19.7')
}

allprojects {
    group = 'com.jobmonitor'
    version = '1.0.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // ── Lombok (all modules) ──
        compileOnly     'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // ── Logging ──
        implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

        // ── Testing ──
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()
        jvmArgs '-XX:+EnableDynamicAgentLoading'
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }
}

// ── Wrapper task ──
wrapper {
    gradleVersion = '8.7'
    distributionType = Wrapper.DistributionType.BIN
}
