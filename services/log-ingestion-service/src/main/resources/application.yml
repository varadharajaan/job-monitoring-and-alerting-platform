# ═══════════════════════════════════════════════════════════════════
#  Log Ingestion Service — Configuration
# ═══════════════════════════════════════════════════════════════════
server:
  port: ${LOG_INGESTION_PORT:8086}

spring:
  application:
    name: log-ingestion-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config:config@localhost:8888}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:jobmonitor}
    username: ${POSTGRES_USER:jobmonitor}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: log_ingestion

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USER:}
    password: ${ELASTICSEARCH_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}

app:
  kafka:
    topics:
      log-events: log-events

# ── Actuator & Metrics ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: log-ingestion-service
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── Eureka ──
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka@localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# ── Logging ──
logging:
  level:
    com.jobmonitor.logingest: DEBUG
    org.springframework.data.elasticsearch: INFO
