# ═══════════════════════════════════════════════════════════════
# AWS Production profile — notification-service
# Uses SES for email and SNS for SMS in production.
# ═══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
  jpa:
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:AWS_MSK_IAM}
      sasl.jaas.config: >
        software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
  mail:
    host: ${SMTP_HOST:email-smtp.us-east-1.amazonaws.com}
    port: ${SMTP_PORT:587}
    username: ${SES_SMTP_USERNAME}
    password: ${SES_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

platform:
  kafka:
    topics:
      default-replicas: ${KAFKA_DEFAULT_REPLICAS:3}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:6}
  notification:
    rate-limit:
      email: ${RATE_LIMIT_EMAIL:500}
      sms: ${RATE_LIMIT_SMS:100}
      slack: ${RATE_LIMIT_SLACK:500}
      push: ${RATE_LIMIT_PUSH:1000}
  s3:
    enabled: true
    bucket: ${S3_LOG_BUCKET:job-monitor-logs-prod}
    region: ${AWS_REGION:us-east-1}
  logging:
    dir: /var/log/jobmonitor
    max-file-size: 100MB
    max-history: 14
    total-size-cap: 5GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.jobmonitor: INFO
