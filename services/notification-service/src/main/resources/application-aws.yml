# ═══════════════════════════════════════════════════════════════
# AWS profile — Notification Service
# Activated via: SPRING_PROFILES_ACTIVE=aws
# Uses: RDS PostgreSQL, ElastiCache Redis, MSK Kafka, SES, SNS
# ═══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${AWS_RDS_URL}
    username: ${AWS_RDS_USERNAME}
    password: ${AWS_RDS_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    show-sql: false
  kafka:
    bootstrap-servers: ${AWS_MSK_BOOTSTRAP}
    properties:
      security.protocol: SSL
      ssl.truststore.location: /etc/kafka/ssl/truststore.jks
      ssl.truststore.password: ${AWS_MSK_TRUSTSTORE_PASSWORD}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
  data:
    redis:
      host: ${AWS_ELASTICACHE_HOST}
      port: ${AWS_ELASTICACHE_PORT:6379}
      password: ${AWS_ELASTICACHE_PASSWORD:}
      ssl:
        enabled: ${AWS_ELASTICACHE_SSL:true}
  mail:
    host: ${AWS_SES_SMTP_HOST:email-smtp.us-east-1.amazonaws.com}
    port: ${AWS_SES_SMTP_PORT:587}
    username: ${AWS_SES_SMTP_USER}
    password: ${AWS_SES_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true

platform:
  aws:
    ses:
      region: ${AWS_REGION:us-east-1}
      from-email: ${AWS_SES_FROM_EMAIL}
    sns:
      topic-arn: ${AWS_SNS_NOTIFICATION_TOPIC_ARN:}
      region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.jobmonitor: INFO

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
