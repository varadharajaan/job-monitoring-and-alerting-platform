server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/configs}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: ${CONFIG_GIT_BRANCH:main}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:}
          clone-on-start: ${CONFIG_GIT_CLONE_ON_START:true}
  security:
    user:
      name: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}

logging:
  level:
    org.springframework.cloud.config: ${LOG_LEVEL_CONFIG:INFO}
