# ═══════════════════════════════════════════════════════════════
# AWS Production profile — auth-service
# All secrets from AWS Secrets Manager / SSM Parameter Store
# ═══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
  jpa:
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:AWS_MSK_IAM}
      sasl.jaas.config: >
        software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

auth:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:PT24H}

platform:
  logging:
    dir: /var/log/jobmonitor
    max-file-size: 100MB
    max-history: 14
    total-size-cap: 5GB
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.jobmonitor: INFO
