# ═══════════════════════════════════════════════════════════════
# Production profile — AWS managed services (MSK, RDS, ElastiCache)
# Activated via: SPRING_PROFILES_ACTIVE=prod
# ═══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONN_TIMEOUT:30000}
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:AWS_MSK_IAM}
      sasl.jaas.config: >
        software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 5000ms
  flyway:
    enabled: true

platform:
  kafka:
    topics:
      default-replicas: ${KAFKA_DEFAULT_REPLICAS:3}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:6}
  s3:
    enabled: true
    bucket: ${S3_LOG_BUCKET:job-monitor-logs-prod}
    region: ${AWS_REGION:us-east-1}
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
  logging:
    dir: /var/log/jobmonitor
    max-file-size: 100MB
    max-history: 14
    total-size-cap: 5GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: WARN
    com.jobmonitor: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
