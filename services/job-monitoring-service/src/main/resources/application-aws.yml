# ═══════════════════════════════════════════════════════════════
# AWS profile — Job Monitoring Service
# Activated via: SPRING_PROFILES_ACTIVE=aws
# Uses: RDS PostgreSQL, ElastiCache Redis, MSK Kafka, S3
# ═══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${AWS_RDS_URL}
    username: ${AWS_RDS_USERNAME}
    password: ${AWS_RDS_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: ${AWS_MSK_BOOTSTRAP}
    properties:
      security.protocol: SSL
      ssl.truststore.location: /etc/kafka/ssl/truststore.jks
      ssl.truststore.password: ${AWS_MSK_TRUSTSTORE_PASSWORD}
    producer:
      acks: all
      retries: 3
      batch-size: 16384
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${AWS_ELASTICACHE_HOST}
      port: ${AWS_ELASTICACHE_PORT:6379}
      password: ${AWS_ELASTICACHE_PASSWORD:}
      ssl:
        enabled: ${AWS_ELASTICACHE_SSL:true}
      timeout: 5000ms
  flyway:
    enabled: true

platform:
  kafka:
    topics:
      default-replicas: ${KAFKA_DEFAULT_REPLICAS:3}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  s3:
    enabled: true
    bucket-name: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:us-east-1}
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: WARN
    com.jobmonitor: INFO

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL}
    registry-fetch-interval-seconds: 15
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45
