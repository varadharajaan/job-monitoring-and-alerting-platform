# ============================================================================
# Deploy to Azure — Build images → Push to ACR → Deploy to AKS
# ============================================================================
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'deploy/aws/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, prod]

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-jobmonitor-prod
  AKS_CLUSTER_NAME: aks-jobmonitor-prod
  ACR_NAME: acrjobmonitorprod
  JAVA_VERSION: '17'

jobs:
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    strategy:
      matrix:
        service:
          - eureka-server
          - config-server
          - auth-service
          - ingestion-gateway
          - job-monitoring-service
          - alerting-service
          - notification-service
          - job-queue-service
          - log-ingestion-service
          - db-performance-service
          - job-worker
          - notification-worker

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Determine module path
        id: module
        run: |
          if [[ "${{ matrix.service }}" == *-worker ]]; then
            echo "path=workers/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "path=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build JAR
        run: ./gradlew :${{ matrix.service }}:bootJar --no-daemon

      - name: Build and push Docker image
        env:
          ACR_LOGIN_SERVER: ${{ env.ACR_NAME }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/${{ matrix.service }}:$IMAGE_TAG \
            -t $ACR_LOGIN_SERVER/${{ matrix.service }}:latest \
            -f ${{ steps.module.outputs.path }}/Dockerfile \
            ${{ steps.module.outputs.path }}

          docker push $ACR_LOGIN_SERVER/${{ matrix.service }}:$IMAGE_TAG
          docker push $ACR_LOGIN_SERVER/${{ matrix.service }}:latest

  deploy:
    name: Deploy to AKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy K8s manifests
        env:
          ACR_LOGIN_SERVER: ${{ env.ACR_NAME }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Apply namespace, configmap, secrets
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/configmap.yaml

          # Apply infrastructure
          kubectl apply -f deploy/k8s/infra/

          # Deploy services with updated image
          for svc in deploy/k8s/services/*.yaml; do
            sed -i "s|image:.*|image: ${ACR_LOGIN_SERVER}/$(basename $svc .yaml):${IMAGE_TAG}|g" "$svc"
            kubectl apply -f "$svc"
          done

          # Apply monitoring & HPA
          kubectl apply -f deploy/k8s/monitoring/
          kubectl apply -f deploy/k8s/hpa.yaml
          kubectl apply -f deploy/k8s/ingress.yaml

      - name: Verify rollout
        run: |
          SERVICES=(
            eureka-server config-server auth-service ingestion-gateway
            job-monitoring-service alerting-service notification-service
            job-queue-service log-ingestion-service db-performance-service
            job-worker notification-worker
          )
          for svc in "${SERVICES[@]}"; do
            echo "Waiting for $svc rollout..."
            kubectl rollout status deployment/$svc -n jobmonitor --timeout=300s || true
          done

      - name: Smoke test
        run: |
          GATEWAY_IP=$(kubectl get svc ingestion-gateway -n jobmonitor -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Gateway IP: $GATEWAY_IP"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$GATEWAY_IP:8080/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Smoke test failed"
          exit 1
